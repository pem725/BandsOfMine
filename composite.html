<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bands of Mine — the composite of your taste</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{--bg:#0d0f12;--panel:#16191f;--line:#262b34;--ink:#e8e6e1;--dim:#8b8f98;--accent:#d9843b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;
    grid-template-areas:"head head" "sky side";height:100vh;overflow:hidden}
  header{grid-area:head;padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  header a{color:var(--accent);text-decoration:none;font-size:13px}
  header a:hover{text-decoration:underline}
  header .nav{margin-left:auto;display:flex;gap:14px}
  .overlay{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .overlay button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
    border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:5px}
  .overlay button.on{color:var(--ink)}
  .overlay button .sw{width:9px;height:9px;border-radius:2px;flex:none;opacity:.35}
  .overlay button.on .sw{opacity:1}
  #sky{grid-area:sky;position:relative;overflow:hidden}
  #sky svg{width:100%;height:100%;display:block;cursor:grab}
  #sky svg:active{cursor:grabbing}
  aside{grid-area:side;border-left:1px solid var(--line);background:var(--panel);
    padding:16px;overflow-y:auto}
  aside h2{font-size:16px;margin:0 0 2px}
  aside .kv{color:var(--dim);font-size:12px;margin:6px 0}
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    margin:16px 0 8px;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between}
  aside ul{list-style:none;padding:0;margin:0}
  aside li{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  aside li.static{cursor:default}
  aside li:hover b{color:var(--accent)}
  .nbr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .nbr-top .sim{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:4px;background:#0d0f12}
  .bar span{height:100%}
  .why{display:flex;gap:10px;margin-top:5px;font-size:10px;color:var(--dim);flex-wrap:wrap}
  .why i{font-style:normal;display:flex;align-items:center;gap:3px}
  .why .sw{width:7px;height:7px;border-radius:2px}
  .tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px}
  .lineup{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .lineup span{font-size:11px;color:var(--dim);background:#0d0f12;border:1px solid var(--line);
    border-radius:4px;padding:1px 6px}
  .lineup span.node{color:var(--ink);cursor:pointer}
  .lineup span.node:hover{border-color:var(--accent)}
  .empty{color:var(--dim)}
  .star{cursor:pointer;stroke:var(--bg);stroke-width:1px}
  .star:hover{stroke:#fff;stroke-width:1.5px}
  .lbl{font-size:9px;fill:var(--ink);pointer-events:none;paint-order:stroke;
    stroke:var(--bg);stroke-width:2.5px;stroke-linejoin:round}
  .legend{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--dim);
    background:rgba(13,15,18,.72);padding:8px 10px;border-radius:8px;max-height:46vh;overflow:auto;max-width:220px}
  .legend div{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .faded{opacity:.08}
</style>
</head>
<body>
<header>
  <h1>The Composite of Your Taste</h1>
  <span class="sub">similarity + who actually played together</span>
  <span class="overlay" id="overlay">links:</span>
  <span class="nav">
    <a href="index.html">the network →</a>
    <a href="sonic.html">the sonic map →</a>
    <a href="families.html">the families →</a>
    <a href="geo.html">the map →</a>
  </span>
</header>
<div id="sky"><div class="legend" id="legend"></div></div>
<aside id="panel"><p class="empty">Loading your composite…</p></aside>

<script type="module">
function bucketOf(g){ if(!g) return "unknown"; g=g.toLowerCase();
  if(/blues/.test(g))return"blues"; if(/jazz|swing|bossa/.test(g))return"jazz";
  if(/soul|funk|r&b|motown|gospel/.test(g))return"soul / funk";
  if(/folk|americana|bluegrass|celtic/.test(g))return"folk / americana";
  if(/country/.test(g))return"country"; if(/classical|baroque|opera/.test(g))return"classical";
  if(/reggae|ska|dub/.test(g))return"reggae";
  if(/punk|new wave|alternative|indie|grunge/.test(g))return"alt / punk / new wave";
  if(/prog/.test(g))return"prog"; if(/pop|disco/.test(g))return"pop";
  if(/rock|metal/.test(g))return"rock"; return"other"; }
const BUCKET_COLOR={"rock":"#d9843b","folk / americana":"#68b587","blues":"#6ba3d6",
  "jazz":"#d4b24a","soul / funk":"#c85f5f","country":"#b0763a","classical":"#9d7cd8",
  "reggae":"#4bb3a7","alt / punk / new wave":"#c77fb0","prog":"#8a7cc0","pop":"#e0a86a",
  "other":"#7d8590","unknown":"#4a4f58"};

// four similarity signals + one factual one (personnel)
const DIMS=["influence","sound","style","background","personnel"];
const DIM_COLOR={influence:"#e0a86a",sound:"#6ba3d6",style:"#68b587",background:"#c77fb0",personnel:"#9aa4ad"};
const DIM_LABEL={influence:"who they draw on",sound:"how they sound",style:"genre overlap",
  background:"era & place",personnel:"played together"};

let data;
try { data = await fetch("data/graph/composite.json").then(r=>r.json()); }
catch(e){ document.getElementById("panel").innerHTML =
  `<p class="empty">Couldn't load the composite. Run <code>build_composite.py --write</code>.</p>`; throw e; }

const nodes = data.nodes.map(n=>({...n}));
const byId = new Map(nodes.map(n=>[n.id,n]));
const lineups = data.lineups||{};
const links = data.edges.map(e=>({...e}));

const sky = document.getElementById("sky");
const svg = d3.select("#sky").append("svg");
let W=sky.clientWidth, H=sky.clientHeight;
svg.attr("viewBox",[0,0,W,H]);
const root = svg.append("g");
svg.call(d3.zoom().scaleExtent([.2,6]).on("zoom",ev=>root.attr("transform",ev.transform)));

const maxT = d3.max(nodes,n=>n.tracks)||1;
const rOf = n => n.role==="connector" ? 3.2 : 4+Math.sqrt(n.tracks/maxT)*20;  // members are small satellites
const fillOf = n => BUCKET_COLOR[bucketOf(n.genre)];

// personnel degree per node (how many bands/collabs they tie together) -> label bridges
const pdeg={}; links.forEach(l=>{ if(l.driver==="personnel"){pdeg[l.source]=(pdeg[l.source]||0)+1; pdeg[l.target]=(pdeg[l.target]||0)+1;} });

links.sort((a,b)=> (a.driver==="personnel"?0:1)-(b.driver==="personnel"?0:1) || a.sim-b.sim);
const link = root.append("g").attr("stroke-linecap","round")
  .selectAll("line").data(links).join("line")
  .attr("stroke",d=>DIM_COLOR[d.driver])
  .attr("stroke-opacity",d=>d.driver==="personnel"?0.28:0.18+d.sim*0.5)
  .attr("stroke-width",d=>d.driver==="personnel"?0.7:0.5+d.sim*3)
  .attr("stroke-dasharray",d=>d.driver==="personnel"?"1.5,2.5":null);

const node = root.append("g").selectAll("circle").data(nodes).join("circle")
  .attr("class","star").attr("r",rOf)
  .attr("fill",fillOf).attr("fill-opacity",d=>d.role==="connector"?0.65:1)
  .attr("stroke",d=>d.role==="connector"?"#3a3f48":"var(--bg)")
  .on("click",(_,d)=>select(d))
  .call(d3.drag()
    .on("start",(ev,d)=>{if(!ev.active)simf.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag",(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
    .on("end",(ev,d)=>{if(!ev.active)simf.alphaTarget(0);d.fx=null;d.fy=null;}));
node.append("title").text(d=>d.role==="connector"?`${d.name} — member`:`${d.name} — ${d.tracks} tracks`);

// label the artists you own most, plus the people who bridge ≥2 bands
const label = root.append("g").selectAll("text").data(nodes).join("text")
  .attr("class","lbl").attr("text-anchor","middle").attr("dy",d=>-rOf(d)-3)
  .text(d=> (d.role==="owned"&&d.tracks>=40) || (pdeg[d.id]>=2) ? d.name : "");

const simf = d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id)
    .distance(d=>d.driver==="personnel"?32:50+(1-d.sim)*90)
    .strength(d=>d.driver==="personnel"?0.5:0.05+d.sim*0.5))
  .force("charge",d3.forceManyBody().strength(d=>d.role==="connector"?-55:-240).distanceMax(500))
  .force("collide",d3.forceCollide(d=>rOf(d)+2))
  .force("center",d3.forceCenter(W/2,H/2))
  .force("x",d3.forceX(W/2).strength(0.04)).force("y",d3.forceY(H/2).strength(0.04))
  .on("tick",ticked);

function ticked(){
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("cx",d=>d.x).attr("cy",d=>d.y);
  label.attr("x",d=>d.x).attr("y",d=>d.y);
}

// ---- overlay toggles ----
const activeDim = new Set(DIMS);
const ov = document.getElementById("overlay");
DIMS.forEach(dim=>{
  const b=document.createElement("button"); b.className="on"; b.dataset.dim=dim;
  b.innerHTML=`<span class="sw" style="background:${DIM_COLOR[dim]}"></span>${dim}`;
  b.onclick=()=>{ activeDim.has(dim)?activeDim.delete(dim):activeDim.add(dim);
    b.classList.toggle("on"); applyOverlay(); };
  ov.appendChild(b);
});
function applyOverlay(){
  link.style("display",d=>activeDim.has(d.driver)?null:"none");
  const live=new Set();
  links.forEach(d=>{ if(activeDim.has(d.driver)){live.add(d.source.id);live.add(d.target.id);} });
  // owned nodes always visible; connectors only while some personnel link shows them
  node.style("display",d=> d.role==="owned"||live.has(d.id)?null:"none");
  label.style("display",d=> (d.role==="owned"||live.has(d.id)) &&
    ((d.role==="owned"&&d.tracks>=40)||pdeg[d.id]>=2) ?null:"none");
}

// ---- neighbours for the panel ----
const nbrs = new Map();
links.forEach(d=>{
  const s=d.source.id||d.source, t=d.target.id||d.target;
  if(!nbrs.has(s))nbrs.set(s,[]); if(!nbrs.has(t))nbrs.set(t,[]);
  nbrs.get(s).push({o:t,e:d}); nbrs.get(t).push({o:s,e:d});
});

function whyBar(by){
  const seg=DIMS.filter(k=>by[k]!=null && by[k]>0);
  const tot=seg.reduce((s,k)=>s+by[k],0)||1;
  return `<div class="bar">${seg.map(k=>
    `<span style="background:${DIM_COLOR[k]};width:${by[k]/tot*100}%"></span>`).join("")}</div>
    <div class="why">${seg.sort((a,b)=>by[b]-by[a]).map(k=>
      `<i><span class="sw" style="background:${DIM_COLOR[k]}"></span>${k} ${by[k].toFixed(2)}</i>`).join("")}</div>`;
}

function select(d){
  const all=(nbrs.get(d.id)||[]).map(x=>({n:byId.get(x.o),e:x.e})).filter(x=>x.n);
  const simN=all.filter(x=>x.e.driver!=="personnel").sort((a,b)=>b.e.sim-a.e.sim);
  const perN=all.filter(x=>x.e.driver==="personnel");
  const full=lineups[d.id];
  const kindTag = d.role==="connector" ? `<span class="tag">member</span>` :
                  d.kind==="band" ? `<span class="tag">band</span>` : "";
  let html=`
    <div class="kv" style="color:${fillOf(d)};text-transform:uppercase;letter-spacing:.06em;font-size:11px">${d.genre||"—"}</div>
    <h2>${d.name} ${kindTag}</h2>
    <div class="kv">${d.origin||"—"}${d.born?" · b. "+d.born:""}${d.role==="owned"?` · ${d.tracks} tracks you own`:""}</div>`;

  if(full && full.length){
    html+=`<h3>full lineup <span>${full.length}</span></h3><div class="lineup">${
      full.map(nm=>{ const m=nodes.find(x=>x.name===nm);
        return m?`<span class="node" data-id="${m.id}">${nm}</span>`:`<span>${nm}</span>`; }).join("")}</div>`;
  }
  if(perN.length){
    html+=`<h3>played with <span>${perN.length}</span></h3><ul>${perN.map(({n,e})=>
      `<li data-id="${n.id}"><div class="nbr-top"><b>${n.name}</b><span class="sim">${e.note||"personnel"}</span></div></li>`).join("")}</ul>`;
  }
  if(simN.length){
    html+=`<h3>closest in your composite — and why</h3><ul>${simN.map(({n,e})=>`
      <li data-id="${n.id}"><div class="nbr-top"><b>${n.name}</b><span class="sim">${e.sim.toFixed(2)} · ${e.driver}</span></div>
      ${whyBar(e.by)}</li>`).join("")}</ul>`;
  }
  document.getElementById("panel").innerHTML=html;
  document.querySelectorAll("#panel [data-id]").forEach(el=>el.onclick=()=>{
    const s=byId.get(el.dataset.id); if(s) select(s); });

  const near=new Set([d.id,...all.map(x=>x.n.id)]);
  node.classed("faded",n=>!near.has(n.id));
  label.classed("faded",n=>!near.has(n.id));
  link.classed("faded",l=>(l.source.id||l.source)!==d.id && (l.target.id||l.target)!==d.id);
}

// ---- legend ----
const gc={}; nodes.forEach(n=>{const b=bucketOf(n.genre); gc[b]=(gc[b]||0)+1;});
let genreSel=null;
document.getElementById("legend").innerHTML=`<b>genre</b>`+
  Object.entries(gc).sort((a,b)=>b[1]-a[1]).map(([b,c])=>
    `<div data-b="${b}"><span class="dot" style="background:${BUCKET_COLOR[b]}"></span>${b} (${c})</div>`).join("");
document.querySelectorAll("#legend div[data-b]").forEach(div=>div.onclick=()=>{
  const b=div.dataset.b; genreSel=genreSel===b?null:b;
  node.classed("faded",n=>genreSel&&bucketOf(n.genre)!==genreSel);
  label.classed("faded",n=>genreSel&&bucketOf(n.genre)!==genreSel);
  link.classed("faded",l=>genreSel);
});

// ---- intro ----
const nOwn=nodes.filter(n=>n.role==="owned").length, nConn=nodes.length-nOwn;
document.getElementById("panel").innerHTML=`<p class="empty">
  <b>${nOwn}</b> artists you own (big dots) plus <b>${nConn}</b> band members who tie them
  together (small dots). Edges are coloured by what connects each pair:</p>
  <div class="why" style="margin:10px 0 0">${DIMS.map(k=>
    `<i><span class="sw" style="background:${DIM_COLOR[k]}"></span><b style="color:var(--ink)">${k}</b> — ${DIM_LABEL[k]}</i>`).join("")}</div>
  <p class="empty" style="margin-top:14px"><b>personnel</b> (dashed) is the strongest tie of all —
  people who were actually in the same band. Toggle it off up top for a pure similarity map.
  Click a band to see its <b>full lineup</b> and who it shares members with.</p>`;

new ResizeObserver(()=>{ W=sky.clientWidth; H=sky.clientHeight; svg.attr("viewBox",[0,0,W,H]);
  simf.force("center",d3.forceCenter(W/2,H/2))
      .force("x",d3.forceX(W/2).strength(0.04)).force("y",d3.forceY(H/2).strength(0.04));
  simf.alpha(.3).restart(); }).observe(sky);
</script>
</body>
</html>
