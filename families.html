<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bands of Mine — the families of your taste</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{--bg:#0d0f12;--panel:#16191f;--line:#262b34;--ink:#e8e6e1;--dim:#8b8f98;--accent:#d9843b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;
    grid-template-areas:"head head" "sky side";height:100vh;overflow:hidden}
  header{grid-area:head;padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  header a{color:var(--accent);text-decoration:none;font-size:13px}
  header a:hover{text-decoration:underline}
  header .nav{margin-left:auto;display:flex;gap:14px}
  #sky{grid-area:sky;position:relative;overflow:hidden}
  #sky svg{width:100%;height:100%;display:block;cursor:grab}
  #sky svg:active{cursor:grabbing}
  aside{grid-area:side;border-left:1px solid var(--line);background:var(--panel);
    padding:16px;overflow-y:auto}
  aside h2{font-size:15px;margin:0 0 2px}
  aside .kv{color:var(--dim);font-size:12px;margin:6px 0}
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    margin:16px 0 6px;border-top:1px solid var(--line);padding-top:12px}
  aside ul{list-style:none;padding:0;margin:0}
  aside li{padding:4px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  aside li:hover b{color:var(--accent)}
  .empty{color:var(--dim)}
  .fam-label{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);
    stroke-width:4px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
  .star{cursor:pointer;stroke:var(--bg);stroke-width:1px}
  .star:hover{stroke:#fff;stroke-width:1.5px}
  .lbl{font-size:9px;fill:var(--ink);pointer-events:none;paint-order:stroke;
    stroke:var(--bg);stroke-width:2.5px;stroke-linejoin:round}
  .legend{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--dim);
    background:rgba(13,15,18,.72);padding:8px 10px;border-radius:8px;max-height:44vh;overflow:auto;max-width:230px}
  .legend div{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .faded{opacity:.12}
</style>
</head>
<body>
<header>
  <h1>The Families of Your Taste</h1>
  <span class="sub">your owned artists, clustered by the taproot they most share</span>
  <span class="nav">
    <a href="index.html">the network →</a>
    <a href="sonic.html">the sonic map →</a>
  </span>
</header>
<div id="sky"><div class="legend" id="legend"></div></div>
<aside id="panel"><p class="empty">Loading your constellation…</p></aside>

<script type="module">
const PALETTE=["#d9843b","#6ba3d6","#68b587","#c85f5f","#9d7cd8","#d4b24a","#4bb3a7","#c77fb0",
  "#7d9e5a","#b0763a","#5a8fb0","#c58f5f","#8a7cc0","#b8555f","#5fa88f","#a89b4a",
  "#cf7d4b","#6f9bd0","#7ab090","#c76b8f","#9a884a","#5c93a8","#b58cc8","#8fae60"];

let data;
try { data = await fetch("data/graph/families.json").then(r=>r.json()); }
catch(e){ document.getElementById("panel").innerHTML =
  `<p class="empty">No families.json yet. Run <code>build_families.py --write</code>.</p>`; throw e; }

const fams = data.families;
const sky = document.getElementById("sky");
const svg = d3.select("#sky").append("svg");
const root = svg.append("g");
let W=sky.clientWidth, H=sky.clientHeight;
function measure(){ W=sky.clientWidth; H=sky.clientHeight; svg.attr("viewBox",[-W/2,-H/2,W,H]); }
measure();

// place each family centre on a spiral so bigger families sit toward the middle
const R = Math.min(W,H)*0.42;
fams.forEach((f,i)=>{
  const ang = i * 2.399963;               // golden angle -> even spread
  const rad = R * Math.sqrt((i+0.6)/fams.length);
  f.cx = Math.cos(ang)*rad;
  f.cy = Math.sin(ang)*rad;
  f.color = PALETTE[i % PALETTE.length];
});

// build star nodes
const stars=[];
fams.forEach((f,fi)=> f.members.forEach(m=>
  stars.push({...m, fi, fam:f.name, color:f.color, cx:f.cx, cy:f.cy})));
const maxT = d3.max(stars, s=>s.tracks) || 1;
const rOf = s => 3 + Math.sqrt(s.tracks/maxT)*11;

svg.call(d3.zoom().scaleExtent([0.35,5]).on("zoom",ev=>root.attr("transform",ev.transform)));

const sim = d3.forceSimulation(stars)
  .force("x", d3.forceX(d=>d.cx).strength(0.16))
  .force("y", d3.forceY(d=>d.cy).strength(0.16))
  .force("charge", d3.forceManyBody().strength(-26))
  .force("collide", d3.forceCollide().radius(d=>rOf(d)+1.5))
  .on("tick", tick);

const famLabels = root.append("g").selectAll("text").data(fams).join("text")
  .attr("class","fam-label").attr("font-size",d=>Math.min(20,11+d.members.length*0.4))
  .attr("fill-opacity",0.9).text(d=>d.name);

let sel=null;
const g = root.append("g").selectAll("g.star").data(stars).join("g").attr("class","star-g");
g.append("circle").attr("class","star").attr("r",rOf).attr("fill",d=>d.color)
  .on("click",(_,d)=>select(d))
  .on("mouseover",(ev,d)=>hover(d,true)).on("mouseout",(ev,d)=>hover(d,false));
// label the biggest few stars per family up front
const showN = new Set();
fams.forEach(f=> f.members.slice(0,3).forEach(m=>showN.add(m.id)));
g.filter(d=>showN.has(d.id)).append("text").attr("class","lbl").attr("dy",-9)
  .attr("text-anchor","middle").text(d=>d.name);

function hover(d,on){
  const node=g.filter(n=>n===d);
  if(on && node.select("text").empty())
    node.append("text").attr("class","lbl tmp").attr("dy",-9).attr("text-anchor","middle").text(d.name);
  else if(!showN.has(d.id)) node.select("text.tmp").remove();
}
function tick(){
  g.attr("transform",d=>`translate(${d.x},${d.y})`);
  famLabels.attr("x",d=>d.cx).attr("y",d=>{
    const ys=stars.filter(s=>s.fi===fams.indexOf(d)).map(s=>s.y);
    return (ys.length?Math.min(...ys):d.cy)-16;
  });
}

function select(d){
  sel=d;
  g.selectAll("text.tmp").remove();
  g.classed("faded",n=>n.fi!==d.fi);
  famLabels.classed("faded",f=>fams.indexOf(f)!==d.fi);
  const fam=fams[d.fi];
  const p=document.getElementById("panel");
  p.innerHTML=`
    <div class="kv" style="color:${d.color};text-transform:uppercase;letter-spacing:.08em;font-size:11px">
      ${fam.name} family · ${fam.members.length} artists</div>
    <h2>${d.name}</h2>
    <div class="kv">${d.tracks} tracks you own</div>
    <div class="kv">shares these roots with your collection:<br><b>${(d.roots||[]).join(" · ")||"—"}</b></div>
    <h3>others in the ${fam.name} family</h3>
    <ul>${fam.members.filter(m=>m.id!==d.id).map(m=>
      `<li data-id="${m.id}"><b>${m.name}</b> <span class="kv" style="margin:0">${m.tracks}tk</span></li>`).join("")}</ul>`;
  p.querySelectorAll("li[data-id]").forEach(li=>li.onclick=()=>{
    const s=stars.find(x=>x.id===li.dataset.id); if(s) select(s);
  });
}

document.getElementById("legend").innerHTML =
  `<b>${fams.length} families · ${stars.length} artists</b>` +
  fams.map((f,i)=>`<div data-fi="${i}"><span class="dot" style="background:${f.color}"></span>${f.name} (${f.members.length})</div>`).join("");
document.querySelectorAll(".legend div[data-fi]").forEach(el=>el.onclick=()=>{
  const s=stars.find(x=>x.fi==el.dataset.fi); if(s) select(s);
});

document.getElementById("panel").innerHTML =
  `<p class="empty"><b>${stars.length}</b> artists you own, grouped into <b>${fams.length}</b> families.<br><br>
   Each cluster orbits the taproot its members most share — the gravitational
   center of that corner of your taste. Bigger stars = more tracks you own.
   Click any star (or a legend row) to light up its family.</p>`;

new ResizeObserver(()=>{measure();}).observe(sky);
</script>
</body>
</html>
