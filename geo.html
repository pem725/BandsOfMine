<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bands of Mine — the geography of your taste</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{--bg:#0d0f12;--panel:#16191f;--line:#262b34;--ink:#e8e6e1;--dim:#8b8f98;--accent:#d9843b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;
    grid-template-areas:"head head" "map side";height:100vh;overflow:hidden}
  header{grid-area:head;padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  header .nav{margin-left:auto;display:flex;gap:14px}
  header a{color:var(--accent);text-decoration:none;font-size:13px}
  header a:hover{text-decoration:underline}
  #map{grid-area:map;position:relative;overflow:hidden}
  #map svg{width:100%;height:100%;display:block;cursor:grab}
  #map svg:active{cursor:grabbing}
  .country{fill:#1a1e25;stroke:#2b3038;stroke-width:.5px}
  .dot{cursor:pointer;stroke:var(--bg);stroke-width:.7px}
  .dot:hover{stroke:#fff;stroke-width:1.4px}
  .lbl{font-size:9px;fill:var(--ink);pointer-events:none;paint-order:stroke;
    stroke:var(--bg);stroke-width:2.5px;stroke-linejoin:round}
  aside{grid-area:side;border-left:1px solid var(--line);background:var(--panel);
    padding:16px;overflow-y:auto}
  aside h2{font-size:15px;margin:0 0 2px}
  aside .kv{color:var(--dim);font-size:12px;margin:6px 0}
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    margin:16px 0 6px;border-top:1px solid var(--line);padding-top:12px}
  aside ul{list-style:none;padding:0;margin:0}
  aside li{padding:4px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  aside li:hover b{color:var(--accent)}
  .legend{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--dim);
    background:rgba(13,15,18,.72);padding:8px 10px;border-radius:8px}
  .legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
  .legend .dot2{width:9px;height:9px;border-radius:50%}
  .empty{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>The Geography of Your Taste</h1>
  <span class="sub">where your artists come from — colored by genre, sized by tracks owned</span>
  <span class="nav">
    <a href="index.html">the network →</a>
    <a href="sonic.html">the sonic map →</a>
    <a href="families.html">the families →</a>
    <a href="composite.html">the composite →</a>
  </span>
</header>
<div id="map"><div class="legend" id="legend"></div></div>
<aside id="panel"><p class="empty">Loading the atlas…</p></aside>

<script type="module">
function bucketOf(g){ if(!g) return "unknown"; g=g.toLowerCase();
  if(/blues/.test(g))return"blues"; if(/jazz|swing|bossa/.test(g))return"jazz";
  if(/soul|funk|r&b|motown|gospel/.test(g))return"soul / funk";
  if(/folk|americana|bluegrass|celtic/.test(g))return"folk / americana";
  if(/country/.test(g))return"country"; if(/classical|baroque|opera/.test(g))return"classical";
  if(/reggae|ska|dub/.test(g))return"reggae";
  if(/punk|new wave|alternative|indie|grunge/.test(g))return"alt / punk / new wave";
  if(/prog/.test(g))return"prog"; if(/pop|disco/.test(g))return"pop";
  if(/rock|metal/.test(g))return"rock"; return"other"; }
const BUCKET_COLOR={"rock":"#d9843b","folk / americana":"#68b587","blues":"#6ba3d6",
  "jazz":"#d4b24a","soul / funk":"#c85f5f","country":"#b0763a","classical":"#9d7cd8",
  "reggae":"#4bb3a7","alt / punk / new wave":"#c77fb0","prog":"#8a7cc0","pop":"#e0a86a",
  "other":"#7d8590","unknown":"#4a4f58"};

let geo, world;
try {
  [geo, world] = await Promise.all([
    fetch("data/graph/geo.json").then(r=>r.json()),
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json()),
  ]);
} catch(e){ document.getElementById("panel").innerHTML =
  `<p class="empty">Couldn't load the map. Run <code>build_geo.py --write</code> and check your connection.</p>`; throw e; }

const pts = geo.points;
const map = document.getElementById("map");
const svg = d3.select("#map").append("svg");
const root = svg.append("g");
let W=map.clientWidth, H=map.clientHeight;
const proj = d3.geoNaturalEarth1();
const path = d3.geoPath(proj);
function fit(){ W=map.clientWidth; H=map.clientHeight; svg.attr("viewBox",[0,0,W,H]);
  proj.fitExtent([[10,10],[W-10,H-10]], {type:"Sphere"}); }
fit();

// basemap
const land = topojson.feature(world, world.objects.countries);
root.append("path").datum({type:"Sphere"}).attr("fill","#12151a").attr("d",path);
root.append("g").selectAll("path").data(land.features).join("path")
  .attr("class","country").attr("d",path);

svg.call(d3.zoom().scaleExtent([1,8]).on("zoom",ev=>root.attr("transform",ev.transform)));

// project points, then declump co-located artists with a tiny force
pts.forEach(p=>{ const xy=proj([p.lon,p.lat]); p.x0=xy?xy[0]:null; p.y0=xy?xy[1]:null; });
const good = pts.filter(p=>p.x0!=null);
const maxT = d3.max(good,p=>p.tracks)||1;
const rOf = p => 2.5 + Math.sqrt(p.tracks/maxT)*8;
good.forEach(p=>{p.x=p.x0; p.y=p.y0;});
d3.forceSimulation(good)
  .force("x",d3.forceX(d=>d.x0).strength(0.5))
  .force("y",d3.forceY(d=>d.y0).strength(0.5))
  .force("collide",d3.forceCollide(d=>rOf(d)+0.6))
  .stop().tick(120);

let sel=null;
const g = root.append("g").selectAll("g").data(good).join("g")
  .attr("transform",d=>`translate(${d.x},${d.y})`);
g.append("circle").attr("class","dot").attr("r",rOf)
  .attr("fill",d=>BUCKET_COLOR[bucketOf(d.genre)])
  .on("click",(_,d)=>select(d))
  .on("mouseover",(ev,d)=>{ if(d!==sel) g.filter(n=>n===d).append("text").attr("class","lbl tmp").attr("dy",-8).attr("text-anchor","middle").text(d.name); })
  .on("mouseout",(ev,d)=>{ if(d!==sel) g.filter(n=>n===d).select("text.tmp").remove(); });

// place counts for the panel
const byPlace={};
good.forEach(p=>{ (byPlace[p.place]=byPlace[p.place]||[]).push(p); });

function select(d){
  sel=d; g.selectAll("text.tmp").remove();
  g.filter(n=>n===d).append("text").attr("class","lbl tmp").attr("dy",-8).attr("text-anchor","middle").text(d.name);
  const here=byPlace[d.place]||[];
  document.getElementById("panel").innerHTML=`
    <div class="kv" style="color:${BUCKET_COLOR[bucketOf(d.genre)]};text-transform:uppercase;letter-spacing:.06em;font-size:11px">${d.genre||"—"}</div>
    <h2>${d.name}</h2>
    <div class="kv">from <b>${d.place}</b> · ${d.tracks} tracks you own</div>
    <h3>${here.length} of your artists from ${d.place}</h3>
    <ul>${here.filter(x=>x.id!==d.id).map(x=>`<li data-id="${x.id}"><b>${x.name}</b> <span class="kv" style="margin:0">${x.tracks}tk</span></li>`).join("")||'<li class="empty">just this one</li>'}</ul>`;
  document.querySelectorAll("#panel li[data-id]").forEach(li=>li.onclick=()=>{const s=good.find(x=>x.id===li.dataset.id); if(s) select(s);});
}

// legend + summary
const genreCount={}; good.forEach(p=>{const b=bucketOf(p.genre); genreCount[b]=(genreCount[b]||0)+1;});
document.getElementById("legend").innerHTML=`<b>genre</b>`+
  Object.entries(genreCount).sort((a,b)=>b[1]-a[1]).map(([b,c])=>
    `<div><span class="dot2" style="background:${BUCKET_COLOR[b]}"></span>${b} (${c})</div>`).join("");

const topPlaces=Object.entries(byPlace).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
document.getElementById("panel").innerHTML=`<p class="empty">
  <b>${good.length}</b> of your artists placed by hometown. Bigger dots = more tracks
  you own; color = genre. Click a dot to see everyone from that city.</p>
  <h3>your biggest music cities</h3>
  <ul>${topPlaces.map(([pl,arr])=>`<li data-pl="${pl}"><b>${pl}</b> <span class="kv" style="margin:0">${arr.length} artists</span></li>`).join("")}</ul>`;
document.querySelectorAll("#panel li[data-pl]").forEach(li=>li.onclick=()=>{const s=byPlace[li.dataset.pl][0]; if(s) select(s);});

new ResizeObserver(()=>{ fit();
  root.selectAll("path.country").attr("d",path);
  root.select("path").attr("d",path);
}).observe(map);
</script>
</body>
</html>
