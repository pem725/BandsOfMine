<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bands of Mine — the sonic map</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root{--bg:#0d0f12;--panel:#16191f;--line:#262b34;--ink:#e8e6e1;--dim:#8b8f98;--accent:#d9843b;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;
    grid-template-areas:"head head" "map side";height:100vh;overflow:hidden}
  header{grid-area:head;padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  header a{color:var(--accent);text-decoration:none;font-size:13px;margin-left:auto}
  header a:hover{text-decoration:underline}
  #map{grid-area:map;position:relative;overflow:hidden}
  #map svg{width:100%;height:100%;display:block;cursor:grab}
  #map svg:active{cursor:grabbing}
  .axis-note{position:absolute;color:var(--dim);font-size:11px;pointer-events:none}
  aside{grid-area:side;border-left:1px solid var(--line);background:var(--panel);
    padding:16px;overflow-y:auto}
  aside h2{font-size:15px;margin:0 0 2px}
  aside .kv{color:var(--dim);font-size:12px;margin:6px 0}
  aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    margin:16px 0 6px;border-top:1px solid var(--line);padding-top:12px}
  aside ul{list-style:none;padding:0;margin:0}
  aside li{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;
    display:flex;align-items:center;gap:8px;cursor:pointer}
  aside li:hover b{color:var(--accent)}
  .bar{height:6px;background:var(--accent);border-radius:3px;flex:none}
  .legend{position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--dim);
    background:rgba(13,15,18,.7);padding:8px 10px;border-radius:8px;max-width:280px}
  .legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
  .legend .sw{width:10px;height:10px;border-radius:50%;flex:none}
  .dot{cursor:pointer;stroke:var(--bg);stroke-width:1px}
  .dot.seed{stroke:#fff;stroke-width:1.6px}
  .lbl{font-size:10px;fill:var(--ink);pointer-events:none;paint-order:stroke;
    stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
  .empty{color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>The Sonic Map</h1>
  <span class="sub">artists placed by how they <em>sound</em> — tempo, tone, energy, timbre</span>
  <a href="index.html">← the influence network</a>
</header>
<div id="map"><div class="legend" id="legend"></div>
  <div class="axis-note" id="axX"></div><div class="axis-note" id="axY"></div>
</div>
<aside id="panel"><p class="empty">Loading fingerprints…</p></aside>

<script type="module">
const CLUSTER_COLORS = ["#d9843b","#6ba3d6","#68b587","#c85f5f","#9d7cd8","#d4b24a","#4bb3a7","#c77fb0"];

let sonic, nodes = [];
try {
  [sonic, nodes] = await Promise.all([
    fetch("data/graph/sonic.json").then(r => r.json()),
    fetch("data/graph/nodes.json").then(r => r.json()).catch(() => []),
  ]);
} catch (e) {
  document.getElementById("panel").innerHTML =
    `<p class="empty">No sonic data yet. Run<br><code>analyze_audio.py</code> then <code>sonic_analysis.py</code>.</p>`;
  throw e;
}
const seedSet = new Set(nodes.filter(n => n.seed).map(n => n.id));
const nameById = new Map(nodes.map(n => [n.id, n.name]));
const A = sonic.artists;
const ids = Object.keys(A);

const map = document.getElementById("map");
const svg = d3.select("#map").append("svg");
const root = svg.append("g");
let W = map.clientWidth, H = map.clientHeight;
function measure(){ W = map.clientWidth; H = map.clientHeight; svg.attr("viewBox",[0,0,W,H]); }
measure();

const xs = ids.map(i => A[i].x), ys = ids.map(i => A[i].y);
const pad = 60;
const sx = d3.scaleLinear().domain([Math.min(...xs), Math.max(...xs)]).range([pad, W - pad]);
const sy = d3.scaleLinear().domain([Math.min(...ys), Math.max(...ys)]).range([H - pad, pad]);
const rOf = d => 4 + 7 * (1 - (A[d].uniqueness ?? 0.5));  // convergent artists a touch bigger

svg.call(d3.zoom().scaleExtent([0.5, 8]).on("zoom", ev => root.attr("transform", ev.transform)));

let sel = null;
const g = root.selectAll("g.node").data(ids).join("g").attr("class","node")
  .attr("transform", d => `translate(${sx(A[d].x)},${sy(A[d].y)})`);
g.append("circle").attr("class", d => "dot" + (seedSet.has(d) ? " seed" : ""))
  .attr("r", rOf).attr("fill", d => CLUSTER_COLORS[A[d].cluster % CLUSTER_COLORS.length])
  .on("click", (_, d) => select(d))
  .on("mouseover", (ev, d) => { showLbl(d, true); })
  .on("mouseout", (ev, d) => { if (d !== sel) showLbl(d, false); });
// Label the seeds and the most distinctive artists by default.
g.filter(d => seedSet.has(d) || (A[d].uniqueness ?? 0) > 0.7)
  .append("text").attr("class","lbl").attr("dy",-9).attr("text-anchor","middle")
  .text(d => A[d].name);

function showLbl(d, on){
  const node = g.filter(n => n === d);
  if (on && node.select("text").empty())
    node.append("text").attr("class","lbl tmp").attr("dy",-9).attr("text-anchor","middle").text(A[d].name);
  else node.select("text.tmp").remove();
}

// axis hints from PCA: label the extremes by what varies most
document.getElementById("axX").style.cssText = "right:12px;bottom:8px;";
document.getElementById("axX").textContent = "→ brighter / faster";
document.getElementById("axY").style.cssText = "left:12px;top:8px;";
document.getElementById("axY").textContent = "↑ more energy / grit";

document.getElementById("legend").innerHTML =
  "<b>sonic families</b>" +
  Object.entries(sonic.clusters).map(([id,c]) =>
    `<div><span class="sw" style="background:${CLUSTER_COLORS[id % CLUSTER_COLORS.length]}"></span>${c.label} · ${c.size}</div>`
  ).join("") +
  `<div style="margin-top:6px">bigger dot = converges with more · white ring = your seed</div>`;

function select(d){
  sel = d;
  g.selectAll("text.tmp").remove();
  showLbl(d, true);
  const a = A[d];
  const cl = sonic.clusters[a.cluster];
  const bar = s => `<span class="bar" style="width:${Math.max(4, s*70)}px"></span>`;
  document.getElementById("panel").innerHTML = `
    <h2>${a.name}</h2>
    <div class="kv">${a.tempo.toFixed(0)} BPM · ${a.key} · ${a.brightness.toFixed(0)} Hz brightness</div>
    <div class="kv">sonic family: <b>${cl ? cl.label : a.cluster}</b></div>
    <div class="kv">uniqueness: <b>${(a.uniqueness*100).toFixed(0)}%</b> ${a.uniqueness>0.7?"— an outlier, this one diverges":a.uniqueness<0.3?"— sits in the thick of your taste":""}</div>
    <h3>sounds most like</h3>
    <ul>${a.neighbors.map(([nid,s]) => `
      <li data-id="${nid}"><b>${A[nid]?A[nid].name:(nameById.get(nid)||nid)}</b>
        ${bar(s)}<span class="kv" style="margin:0">${(s*100).toFixed(0)}%</span></li>`).join("")}</ul>
  `;
  document.querySelectorAll("#panel li[data-id]").forEach(li =>
    li.onclick = () => { if (A[li.dataset.id]) select(li.dataset.id); });
}

document.getElementById("panel").innerHTML =
  `<p class="empty"><b>${sonic.n}</b> artists mapped by sound.<br><br>
   Each dot is an artist placed by tempo, tone, energy and timbre. Neighbours on the
   map <b>converge</b> sonically; the lonely dots on the edges <b>diverge</b>.
   Click any dot to hear (well, read) what it's closest to.</p>`;
new ResizeObserver(() => { measure();
  g.attr("transform", d => `translate(${sx(A[d].x)},${sy(A[d].y)})`);
}).observe(map);
</script>
</body>
</html>
